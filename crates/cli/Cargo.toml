[package]
name = "dbml-cli"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "dbml"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
notify = "8"
rust-embed = { version = "=8.13.0" }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "=1.0.104"
colored = "3.0"
opener = "0.7"
schema = { path = "../schema" }
dbml-syntax = { path = "../dbml-syntax" }
dbml-analysis = { path = "../dbml-analysis" }
dbml-edit = { path = "../dbml-edit" }
