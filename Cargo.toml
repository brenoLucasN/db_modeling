[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
logos = "=0.16.1"
rowan = "=0.18.0-alpha.2"
insta = "=1.49.0"
proptest = "=1.12.0"
schema = { path = "crates/schema" }
dbml-syntax = { path = "crates/dbml-syntax" }
dbml-analysis = { path = "crates/dbml-analysis" }
dbml-edit = { path = "crates/dbml-edit" }
layout = { path = "crates/layout" }

# Build de desenvolvimento otimizado: o GPUI sem otimização fica de 10 a 50x mais lento
# para renderizar. Mantém debug_assertions (o build Windows cruzado depende delas para
# compilar os shaders em tempo de execução).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
